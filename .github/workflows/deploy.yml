name: Deploy Social Media Ad Scheduler to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy to InfinityFree by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          server-dir: /ndoa.kesug.com/htdocs/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/private/config.php
            **/private/**
            **/uploads/**
            **/vendor/**
            **/setup.php
            **/login.php
            **/watch.php
            **/logout.php
            **/admin/**
            **/partials/**
            **/assets/**
